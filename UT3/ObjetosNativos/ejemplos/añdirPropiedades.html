<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Abre la consola</h1>
    <script>
        let coche={
            marca:"Toyota",
            modelo:"Corolla",
            arrancar: function(){
                console.log("El coche está arrancando");
            }

        };
        // Se pueden añadir propiedades 
        coche.motor="Hybrid";
        coche.color="Blnaco";
        
        // Se pueden iterar las propiedades de un objeto con el operador for in 
        for(let p in coche){
            console.log(p);
        }
        // Si llamamos a una propiedad de alguna clase y no existe no genera error sino que devuelve undefined
    </script>
    
</body>
</html>
