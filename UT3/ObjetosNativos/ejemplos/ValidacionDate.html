<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const entrada = prompt("Introduce una fecha (formato AAAA-MM-DD):");

        // Dividimos el texto en año, mes y día
        const partes = entrada.split("-");
        const año = parseInt(partes[0]);
        const mes = parseInt(partes[1]);
        const dia = parseInt(partes[2]);

        // Creamos la fecha con esos valores (ojo: el mes empieza en 0)
        const fecha = new Date(año, mes - 1, dia);

        if (fecha.getFullYear() === año && fecha.getMonth() === mes - 1 && fecha.getDate() === dia) {
            alert("La fecha es válida");
        } else {
            alert("La fecha no es válida");
        }
    </script>
</body>
</html>
