    <h1>Fecha de nacimiento</h1>
    <div class="caja" id="contenido"></div>

    <script>
      let modContenido = document.getElementById("contenido");

      // Pedimos al usuario su fecha de nacimiento
      const entrada = prompt(
        "Introduce tu fecha de nacimiento (formato AAAA-MM-DD): ",
      );

      // Comprobamos si el usuario no ha dejado el campo vacío o ha cancelado
      if (entrada.trim() === "" || entrada === null) {
        // Mostramos un mensaje de error señalando que la operación ha sido cancelada
        modContenido.innerHTML =
          "<p  class='error'>Error. No has introducido ninguna fecha</p> ";
      } else {
        // Dividimos el texto en partes para recoger el año, mes y día
        const partes = entrada.split("-");
        const año = parseInt(partes[0]);
        const mes = parseInt(partes[1]);
        const dia = parseInt(partes[2]);

        // Creamos una fecha con las partes recogidas
        const fechaNac = new Date(año, mes - 1, dia);

        // Comprobamos si la fecha es válida
        if (
          fechaNac.getFullYear() === año &&
          fechaNac.getMonth() === mes - 1 &&
          fechaNac.getDate() === dia
        ) {
          // Calculamos la edad del usuario
          const fechaActual = new Date();
          let edad = fechaActual.getFullYear() - fechaNac.getFullYear();

          if (fechaActual.getDate() === fechaNac.getDate() && fechaActual.getMonth() > fechaNac.getMonth()) {
