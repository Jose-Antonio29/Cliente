<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../estilos.css" rel="stylesheet" type="text/css">
    <style>
        .buttons button {
            border-radius: 7px;
            padding: 5px 20px;
        }

        .buttons button:hover {
            background-color: aqua;
        }

    </style>
    <title>Ejercicio Objetos del Navegador</title>
</head>
<body>
    <h1>Ejercicio: Objetos del Navegador</h1>
    <div class="caja">
        <p id="info"></p>
    </div>
    <div class="buttons">
        <button onclick="location.reload()">Recargar</button>
        <button onclick="location.assign('https://www.google.com')">Ir a Google</button>
    </div>

    <script>
        alert("¡Bienvenido a la página!");

        document.title = "Título cambiado";
        document.getElementById("info").innerHTML = `<strong>Idioma del navegador: </strong>${navigator.language}<br>
                                                     <strong>¿Conectado a internet? </strong>${navigator.onLine ? "Sí" : "No"}<br>
                                                     <strong>Ancho de página: </strong>${window.innerWidth}px<br>
                                                     <strong>Alto de página: </strong>${window.innerHeight}px`;
    </script>
</body>
</html>
