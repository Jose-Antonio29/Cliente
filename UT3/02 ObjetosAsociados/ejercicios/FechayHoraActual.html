<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador con parada y reanudacion</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        margin-top: 50px;
    }
    #contador{font-size: 48px;}
    button{
        margin:10px;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        cursor: pointer;

    }
    #detener{
        background-color: #d00;
        color: white;
    }
    #continuar{
        background-color: #09bb09;
        color: white;
    }

</style>
<body>
    <h2>Temporizador</h2>
    <p id="contador">0</p>
    <button id="continuar" onclick="continuar()">Continuar</button>
    <button id="detener" onclick="detener()">Detener</button>
    <script>
        let segundos=0          //variable que guarda la cantidad de segundos
        let activo=true;          //controla si el temporizadore está activo 
        //funcion que incrementa el contador y lo muestra
        function aumentar(){
            if(activo){
                segundos++
                document.getElementById("contador").innerText=segundos;
            }
           //Volvemos a llamar contar() despues de 1 segundo
           setTimeout(aumentar,1000); 
        }
        //Iniciamos el temporizador al cargar la página
        aumentar();
        //detiene el temporizador 
        function detener(){
            activo=false;
        }
        //funcion para continuar la cuenta
        function continuar(){
            activo=true;
        }
        

    </script>
</body>
</html>
