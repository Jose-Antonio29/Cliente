<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setInterval1</title>
</head>
<body>
    <h1>Ejemplo de setInterval</h1>
    <p>Abre la consola del navegador para ver los mensajes cada segundo</p>

    <script>
        // Muestra "tick" en console cada segundo
        setInterval(function() {
            console.log("tick");
        }, 1000);
    </script>
</body>
</html>
