<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeout 1</title>
</head>
<body>
    <h1>Ejemplo 1 de setTimeout</h1>

    <script>
        // Mostrar un mensaje después de 1 segundo
        setTimeout(function() {
            alert("Hola");
        }, 2000);
    </script>
</body>
</html>
