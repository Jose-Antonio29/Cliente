<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="estilos.css" rel="stylesheet" type="text/css" />
    <title>Fortaleza Password</title>
</head>
<body>
    <script>
        const passwd = prompt("Introduce tu contraseña: ");

        if (passwd === null || passwd.trim() === "") {
            alert("Operación cancelada")
        } else {
            // Comprobamos la fortaleza de la contraseña
            const longitud = passwd.length;
            const tieneMayus = /[A-Z]/.test(passwd);
            const tieneMinus = /[a-z]/.test(passwd);
            const tieneNums = /[0-9]/.test(passwd);
            const tieneEspeciales = /[@#$%\&*?¿¡!]/.test(passwd);
            let fortaleza = "";
            
            // Determinamos el nivel de fortaleza y mostramos el mensaje
            if (longitud >= 8 && tieneMayus && tieneMinus && tieneNums && tieneEspeciales) {
                fortaleza = "Fuerte";
            } else if (longitud >= 6 && (tieneMayus || tieneMinus) && tieneNums) {
                fortaleza = "Media";
            } else if (longitud < 6) {
                fortaleza = "Débil";
            } else {
                // Caso intermedio si no cumple con los criterios de fuerte o medio pero tiene más de 6 caracteres
                fortaleza = "Media (pero puede mejorar)";
            }

            alert(`La fortaleza de la contraseña es ${fortaleza}`);
        }
    </script>
</body>
</html>
