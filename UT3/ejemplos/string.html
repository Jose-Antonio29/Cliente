<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Abre la consola</h1>
    <script>
        let saludo="Hola DAW";
        console.log(saludo[0]);                 // H
        console.log(saludo[1]);                 // o
        console.log(saludo.length);              
        console.log(saludo.includes("DAW"));    // true
        console.log(saludo.toUpperCase());      // HOLA DAW
        console.log(saludo.toLowerCase());      // hola daw
        console.log(saludo.slice(3))            // Hol
        

    </script>
</body>
</html>
